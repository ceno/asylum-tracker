<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2a3d">
  <title>Asylum Tracker</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Asylum Tracker</h1>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.1416 3.1416"/>
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
      </button>
    </div>
    <nav id="day-tabs" class="day-tabs" aria-label="Duel day"></nav>
  </header>

  <section id="settings" class="card settings" hidden>
    <h2>Settings</h2>
    <label>Daily reset (your local time)
      <input id="reset-hour" type="time" step="3600">
    </label>
    <label>Duel Day 1 falls on
      <select id="start-weekday">
        <option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option>
        <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
        <option value="0">Sunday</option>
      </select>
    </label>
    <button id="reset-today" class="link-btn" type="button">Clear today's ticks</button>
    <h3 class="group-head">This device</h3>
    <p id="storage-info" class="sub"></p>
  </section>

  <main>
    <section id="last-chance"></section>

    <section class="card duel" id="duel">
      <div class="duel-banner">
        <img id="duel-art" class="duel-art" alt="">
        <div class="duel-head">
          <h2 id="duel-title"></h2>
          <p class="duel-meta" id="duel-meta"></p>
        </div>
      </div>
      <div id="duel-body" class="duel-body"></div>
    </section>

    <section id="routine"></section>

    <section class="card" id="prep-card">
      <h2>Prep for tomorrow</h2>
      <p class="sub" id="prep-sub"></p>
      <ul id="prep-list" class="checks"></ul>
    </section>

    <p class="credit">Game art © Last Asylum: Plague</p>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
